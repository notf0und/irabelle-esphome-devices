        # ── loading spinner ────────────────────────────────────────────────
        # Shown (by radio_refresh) while the visible page has no resident rows
        # yet, so a page that still has to be fetched shows a spinner instead of
        # five blank row cards. It sits above the rows and below the pager.
        # SAME STYLE AS THE BOOT SPINNER (pages/loading.yaml: 120 deg arc,
        # 1000 ms per turn, grey track) but smaller — 56 px instead of 120 —
        # with the indicator in the theme accent (the boot one stays
        # white/grey, it is the reference look).
        - spinner:
            id: rl_spinner
            x: 212
            y: 260
            width: 56
            height: 56
            arc_length: 120deg
            spin_time: 1000ms
            arc_color: 0x6D6D6D
            hidden: true
            indicator:
              arc_width: 5
              styles: [accent_arc]

        # ── error banner ───────────────────────────────────────────────────
        # Shown (by radio_refresh) when the last directory request FAILED and
        # the visible page still has no resident rows. A failed page must be a
        # visible message, never a spinner that runs forever; the two labels sit
        # in the middle of the row area (the spinner is hidden whenever these
        # are visible, so they never overlap).
        - label:
            id: rl_error
            x: 20
            y: 246
            width: 440
            height: 40
            text: "Could not load this page"
            text_color: 0xFBBF24
            text_align: CENTER
            long_mode: DOT
            text_font: ui_24
            hidden: true
        - label:
            id: rl_error_hint
            x: 20
            y: 290
            width: 440
            height: 22
            text: "Tap refresh to retry"
            text_color: 0x9C9CD9
            text_align: CENTER
            long_mode: DOT
            text_font: ui_16
            hidden: true

