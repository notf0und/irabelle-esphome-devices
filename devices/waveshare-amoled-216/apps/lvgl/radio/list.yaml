              # prev_page() wraps from page 1 to the REAL last page (the total
              # comes from radio-browser's category count) and returns true when
              # the rows for that page still have to be fetched.
              - lambda: 'if (id(radio).prev_page()) id(radio_fetch)->execute();'
            widgets:
              - label:
                  align: CENTER
                  text: "\U000F0141"
                  text_font: mdi_32
