# lvgl:
#   pages:
      id: sound_page
      bg_color: 0x000000
      pad_all: 0
      scrollbar_mode: "OFF"
      widgets:
        - obj:
            id: sound_page_container
            x: 64
            y: 60
            width: 352
            height: 360
            bg_color: 0x000000
            bg_opa: 0%
            border_opa: 0%
            outline_opa: 0%
            pad_all: 0
            scrollbar_mode: "OFF"
            widgets:
              - label:
                  id: sound_page_volume_label
                  x: 0
                  y: 0
                  width: 350
                  height: 32
                  text: "Volume"
                  text_color: 0xFFFFFF
                  text_align: LEFT
                  text_font: montserrat_28
              - slider:
                  id: sound_page_volume_slider
                  x: 0
                  y: 44
                  width: 330
                  height: 20
                  value: 80
                  min_value: 0
                  max_value: 100
                  bg_color: 0x374151
                  radius: 9999
                  knob:
                    bg_color: 0xFFFFFF
                    border_color: 0x9CA3AF
                    border_width: 1
                  indicator:
                    radius: 9999
                    # theme accent
                    styles: [accent_fill]
                  on_value:
                    then:
                      - lambda: |-
                          float current_vol = id(${id}_media_player).volume;
                          int slider_val = (int)(current_vol * 100 + 0.5);
                          if (abs((int)x - slider_val) > 1) {
                            auto call = id(${id}_media_player).make_call();
                            call.set_volume(x / 100.0);
                            call.perform();
                          }

        - label:
            id: sound_page_back_button
            on_release:
              - lvgl.page.show:
                  lvgl_id: ${id}_lvgl
                  id: settings_page
            x: 12
            y: 56
            width: 48
            height: 48
            text: "\uF053"
            text_font: montserrat_42
            text_align: CENTER
            text_color: 0xFFFFFF
