# lvgl:
#   pages:
      id: canvas_1
      bg_color: 0x000000
      pad_all: 0
      scrollbar_mode: "OFF"
      widgets:
        - obj:
            id: content
            x: 64
            y: 60
            width: 352
            height: 360
            bg_color: 0x000000
            bg_opa: 0%
            border_opa: 0%
            outline_opa: 0%
            pad_all: 0
            scrollbar_mode: "OFF"
            widgets:
              - label:
                  id: wireless_label
                  x: 0
                  y: 0
                  width: 350
                  height: 32
                  text: "Wireless"
                  text_color: 0xFFFFFF
                  text_align: LEFT
                  text_font: montserrat_28
              - obj:
                  id: wifi_menu
                  x: 0
                  y: 40
                  width: 352
                  height: 48
                  bg_color: 0x505050
                  border_width: 0
                  border_color: 0x4B5563
                  radius: 8
                  pad_all: 0
                  scrollbar_mode: "OFF"
                  widgets:
                    - label:
                        id: wifi_icon
                        x: 8
                        y: 0
                        width: 32
                        height: 32
                        align: LEFT_MID
                        text: "\U000F05A9"
                        text_color: 0xFFFFFF
                        text_align: CENTER
                        text_font: mdi_32
                    - label:
                        id: lv_label_21
                        x: 56
                        y: 0
                        width: 221
                        height: 30
                        align: LEFT_MID
                        text: "Wi-Fi"
                        text_color: 0xFFFFFF
                        bg_opa: 0%
                        text_align: LEFT
                        text_font: montserrat_28
