# Waveshare ESP32-S3-Touch-AMOLED-2.16
#
# Device package - install it from the irabelle-esphome-devices repository:
# https://github.com/notf0und/irabelle-esphome-devices
#
# Everything below has defaults; set the substitutions to match your device.
substitutions:
  # --- set these (only `name` really has to be unique) ----------------------
  name: waveshare-amoled-216              # hostname / mDNS name
  friendly_name: Waveshare AMOLED 2.16    # device name in Home Assistant
  friendly_name_slug: waveshare_amoled_2_16  # entity_id prefix; match friendly_name
  id: waveshare_amoled_216                # YAML / C++ id prefix
  name_add_mac_suffix: false
  # -------------------------------------------------------------------------

  # Microphone streaming target. Only used by the "Stream Audio" switch; both
  # are editable from Home Assistant at runtime, so this is just the default.
  stream_ip: "127.0.0.1"
  stream_port: 5005
audio_file:
  - id: intro_audio
    file: sounds/intro.flac
  - id: wake_word_audio
    file: sounds/wake_word.flac
  - id: timer_finished_sound
    file: sounds/timer_finished.flac


packages:
  base: !include
    file: ../../packages/common/wireless-base.yaml
  waveshare-amoled-216: !include
    file: ../../packages/devices/waveshare/AMOLED-2.16.yaml
  # ── Apps ──────────────────────────────────────────────────────────────────
  # Each app is a self-contained package: its own LVGL pages, its tile on the
  # Apps screen and its own entities. Comment/remove a line to remove the app;
  # with no apps included the Apps screen is not reachable at all.
  radio_app: !include
    file: apps/lvgl/radio.yaml
  waveshare_settings: !include
    file: apps/waveshare/settings.yaml
  # Optional audio tuning knobs + diagnostics (AEC gain/NLP, AFE type/NS/AGC,
  # barge-in level, RMS readouts) live in a separate package - see
  # docs/waveshare-amoled-216.md#tuning-the-audio-front-end


wifi:
  power_save_mode: none  # Disable power saving for better performance
  reboot_timeout: 10min  # Prevent unnecessary reboots

# Template sensor to determine device rotation based on accelerometer
globals:
   - id: device_rotation
     type: int
     initial_value: '0'

   - id: last_lvgl_rotation  # Track last sent rotation
     type: int
     initial_value: '0'

   - id: status_line_pulsing  # Track if status_line is currently pulsing
     type: bool
     initial_value: 'false'

   - id: status_line_opa  # Current opacity for pulsing animation
     type: uint8_t
     initial_value: '255'

   - id: battery_icon_animating
     type: bool
     initial_value: 'false'

   # ES7210 analog mic gain (dB). Mirrors the audio_adc `mic_gain` default and
   # is the primary input-level knob; tune it before touching post-AEC gain.
   # millis() when the current spoken answer started (barge-in is disarmed for
   # the first BARGE_IN_GUARD_MS of playback, because the AEC needs ~1 s to
   # converge on a new burst and that transient would otherwise stop the answer
   # by itself - measured 10 457 RMS residual at 1 kHz-tone onset).
   - id: tts_start_ms
     type: uint32_t
     restore_value: no
     initial_value: '0'

   - id: aec_gain_db
     type: float
     restore_value: yes
     initial_value: '8.0'

   # 0 = normal, 1 = aggressive, 2 = very_aggressive. The optional
   # "AEC NLP Level" select in waveshare-advanced-audio.yaml writes here; the
   # boot lambda below applies it, so removing that file keeps the last value.
   - id: aec_nlp_level
     type: int
     restore_value: yes
     initial_value: '1'

   - id: mic_analog_gain_db
     type: float
     initial_value: '30.0'

   - id: va_active
     type: bool
     initial_value: 'false'

   - id: client_connected
     type: bool
     initial_value: 'false'

   - id: wake_word_enabled
     type: bool
     restore_value: yes
     initial_value: 'true'

   - id: timer_seconds_left
     type: int
     initial_value: '0'

   - id: timer_total_seconds
     type: int
     initial_value: '0'

   - id: timer_active
     type: bool
     initial_value: 'false'

   - id: timer_ringing
     type: bool
     initial_value: 'false'

   - id: last_brightness_pct
     type: int
     initial_value: '-1'

   - id: always_on_display
     type: bool
     restore_value: yes
     initial_value: 'true'

   - id: volume_popup_dismiss_at
     type: unsigned long
     initial_value: '0'

   - id: show_request_text
     type: bool
     restore_value: yes
     initial_value: 'true'

   - id: show_response_text
     type: bool
     restore_value: yes
     initial_value: 'true'

   - id: request_full_text
     type: std::string
     initial_value: ''

   - id: response_full_text
     type: std::string
     initial_value: ''

   # ── Voice caption sync ───────────────────────────────────────────────────
   # The response text used to be paged out on a fixed wall-clock timer (30
   # chars every 4 s). That could not stay in step with the voice: the TTS text
   # arrives in one piece, sometimes before and sometimes after the audio
   # starts, and the audio path buffers ~1 s in front of the DAC. Captions are
   # now advanced from the speaker's real playback clock
   # (WaveshareDuplexSpeaker::get_played_frames()) and show one sentence of the
   # response at a time, so the text tracks what is actually being spoken.
   - id: caption_active          # a TTS response is being captioned
     type: bool
     initial_value: 'false'

   - id: caption_epoch_valid     # playback-clock origin has been latched
     type: bool
     initial_value: 'false'

   - id: caption_epoch_frames    # speaker frames when the audio actually started
     type: uint64_t
     initial_value: '0'

   - id: caption_rate_mcps       # speaking rate, milli-chars/s (self-calibrating)
     type: int
     restore_value: yes
     initial_value: '14000'

   - id: caption_lead_ms         # constant trim for pipeline/start latency
     type: int
     restore_value: yes
     initial_value: '400'

   - id: caption_last_start      # last rendered sentence span (avoids LVGL churn)
     type: int
     initial_value: '-1'

   - id: caption_last_end
     type: int
     initial_value: '-1'

   - id: caption_span_text
     type: std::string
     initial_value: ''

   - id: caption_changed
     type: bool
     initial_value: 'false'

   # millis() deadline after which the response caption is cleared. Set once the
   # announcement has stopped feeding the speaker, as "now + whatever is still
   # queued in the output ring": the media player calls the announcement finished
   # while up to a second of audio is still buffered ahead of the DAC, and hiding
   # on that signal cleared the text before the voice had actually stopped.
   # 0 = no pending hide.
   - id: caption_hide_at
     type: uint32_t
     initial_value: '0'

esp32:
  board: esp32-s3-devkitc-1
  cpu_frequency: 240MHz
  variant: esp32s3
  flash_size: 16MB

  # Custom partition table: 2 MB `model` partition at 0xD90000 for the ESP-SR
  # models. Installing it needs ONE USB flash of the factory image plus
  # srmodels.bin - see docs/waveshare-amoled-216.md. OTA updates keep working
  # afterwards and never touch the model or nvs partitions.
  # Flashing only the app (normal `esphome upload`) would land in the old slot
  # layout, so do the USB flash first. No-USB alternative: delete this line and
  # run `scripts/pack-models.sh --emit-blob` so the models travel in the app.
  # Local copy of partitions.csv - ESPHome resolves it next to this file
  # (it ships in this repository) or, failing that, in your config directory.
  # See docs/waveshare-amoled-216.md for the one-time USB flash it requires.
  partitions: partitions.csv

  # ── ESP-SR model partition (NSNet2 noise suppression / VADNet) ─────────────
  # 2 MB "model" partition (partitions.csv) holding the raw srmodels.bin that
  # esp-sr memory-maps. micro_wake_word keeps its own wake word — that lives in
  # the app and is completely unaffected.

  framework:
    type: esp-idf
    version: recommended
    components:

      - espressif/esp-sr==2.4.3
    sdkconfig_options:
      CONFIG_ESP32S3_DATA_CACHE_64KB: "y"
      CONFIG_ESP32S3_DATA_CACHE_LINE_64B: "y"
      CONFIG_ESP32S3_INSTRUCTION_CACHE_32KB: "y"

      # Considerably speeds up mWW at the cost of using more PSRAM.
      CONFIG_SPIRAM_RODATA: "y"
      CONFIG_SPIRAM_FETCH_INSTRUCTIONS: "y"

      CONFIG_BT_ALLOCATION_FROM_SPIRAM_FIRST: "y"
      CONFIG_BT_BLE_DYNAMIC_ENV_MEMORY: "y"

      CONFIG_MBEDTLS_EXTERNAL_MEM_ALLOC: "y"
      CONFIG_MBEDTLS_SSL_PROTO_TLS1_3: "y"  # TLS1.3 support isn't enabled by default in IDF 5.1.5

      # Increase LWIP max sockets to avoid exhaustion when radio + TTS simultaneously
      CONFIG_LWIP_MAX_SOCKETS: "40"
      CONFIG_LWIP_MAX_ACTIVE_TCP: "40"

      # ── PSRAM as a real heap (internet-radio crash fix) ────────────────────
      # ESPHome's `psram` component selects CONFIG_SPIRAM_USE_CAPS_ALLOC, which
      # means plain malloc/calloc/new never touch PSRAM: everything the IDF and
      # its libraries allocate through the default heap lands in internal DRAM.
      # Measured on this board while an MP3 stream plays: internal free ~11 kB
      # and the *largest contiguous internal block ~7.6 kB*, while PSRAM still
      # had megabytes free. That broke radio playback in two ways:
      #   * opening an https:// stream needs mbedtls' ~16 KiB SSL in-buffer plus
      #     a ~4 KiB out-buffer in one contiguous internal block ->
      #     `esp-tls: Failed to open new connection` / ESP_ERR_HTTP_CONNECT;
      #   * the 2 MB media ring buffer plus the 24 kB reader/decoder transfer
      #     buffers drained PSRAM, so the physical speaker's 192 kB output ring
      #     buffer fell back to internal DRAM, failed to allocate, and the mixer
      #     hot-spun into a task-watchdog reset.
      # CONFIG_SPIRAM_USE_MALLOC makes malloc/calloc prefer PSRAM for anything
      # larger than SPIRAM_MALLOC_ALWAYSINTERNAL, so those big transient buffers
      # go to PSRAM and internal DRAM stays available for DMA/interrupt work.
      # The media ring buffer below is also reduced (2 MB -> 512 kB) so PSRAM
      # keeps a healthy reserve. Recovery if this ever boot-loops: the
      # bootloader has app rollback enabled, `safe mode`/OTA re-flash works over
      # WiFi, and the board is on USB (/dev/ttyUSB0) via scripts/flash-usb.sh.
      # NOTE: psram's to_code() runs after the user options and re-adds
      # CONFIG_SPIRAM_USE_CAPS_ALLOC=y; the options are written sorted, so
      # MALLOC (later alphabetically) wins the Kconfig choice. Verified in the
      # built sdkconfig.
      CONFIG_SPIRAM: "y"
      CONFIG_SPIRAM_MODE_OCT: "y"
      CONFIG_SPIRAM_SPEED_80M: "y"
      CONFIG_SPIRAM_USE_MALLOC: "y"
      CONFIG_SPIRAM_MALLOC_ALWAYSINTERNAL: "2048"
      CONFIG_SPIRAM_MEMTEST: "n"

esphome:
  id: ${id}
  name: ${name}
  min_version: 2026.8.0
  friendly_name: ${friendly_name}
  name_add_mac_suffix: ${name_add_mac_suffix}
  on_boot:
    - priority: 800
      then:
        - switch.turn_on: ${id}_pa_ctrl_switch
        - pcf85063.read_time  # Read RTC on boot

    # The AEC NLP select restores its UI value but a template select does NOT
    # re-run set_action on restore, so push the restored value into the
    # component explicitly (otherwise the UI shows one level and the DSP uses
    # another).
    - priority: 400
      then:
        - lambda: |-
            // Post-AFE gain drives both micro_wake_word and the STT stream; it
            // is restored from flash, so push it into the component at boot.
            id(${id}_microphone)->set_aec_gain(id(aec_gain_db));
            ESP_LOGI("boot", "AEC Gain applied from restored global: %.1f", id(aec_gain_db));

            // 0 = normal, 1 = aggressive, 2 = very_aggressive
            id(${id}_microphone)->set_aec_nlp(id(aec_nlp_level));
            ESP_LOGI("boot", "AEC NLP applied from restored global: %d", id(aec_nlp_level));

    - priority: 375
      then:
        - script.execute: wake_display
        - lvgl.page.show:
            lvgl_id: ${id}_lvgl
            id: loading_page
        - script.execute: update_time

        - lvgl.widget.update:
            id: always_on_screen_switch
            state:
              checked: !lambda 'return id(always_on_display);'

        - lvgl.widget.update:
            id: show_request_text_switch
            state:
              checked: !lambda 'return id(show_request_text);'

        - lvgl.widget.update:
            id: show_response_text_switch
            state:
              checked: !lambda 'return id(show_response_text);'

        - lvgl.slider.update: # Sync lvgl brightness slider with display_backlight
            id: display_page_brightness_slider
            value: !lambda 'return (int)(id(${id}_display_backlight).current_values.get_brightness() * 100);'

        - media_player.turn_on: ${id}_media_player

        - lvgl.slider.update: # Sync lvgl volume slider with media player volume
            id: sound_page_volume_slider
            value: !lambda 'return (int)(id(${id}_media_player).volume * 100);'


        - lvgl.slider.update: # Sync lvgl volume slider with media player volume
            id: volume_slider
            value: !lambda 'return (int)(id(${id}_media_player).volume * 100);'

psram:
  mode: octal
  speed: 80MHz

#---------------- AUDIO ----------------#
# Codec support for the `speaker` media player's pipeline. Media and
# announcements arrive as URLs (HA forwards them, including internet-radio
# stations), and the on-device reader decodes them with the legacy
# audio::AudioDecoder.
#
# Decoder truth (ESPHome 2026.8.2, components/audio/__init__.py): the firmware
# can decode MP3, FLAC, Ogg Opus and WAV — each enabled by the matching key
# here. It can NOT decode AAC / AAC+ / HE-AAC (no decoder exists in ESPHome at
# all), HLS playlists (a manifest, not a file) or Ogg Vorbis (ESPHome always
# forces CONFIG_MICRO_DECODER_CODEC_VORBIS=False). FLAC was already pulled in by
# the FLAC announcement pipeline; mp3/opus/wav are explicit radio additions.
audio:
  codecs:
    mp3:
    flac:
    opus:
      # Keep Opus state in PSRAM: internal DRAM is the scarce resource here.
      state_memory: psram
    wav:

# I2C Bus (RTC, IMU, ES8311 control)
i2c:
  id: ${id}_i2c
  sda: GPIO15
  scl: GPIO14
  scan: true
  frequency: 400kHz

# Duplex I2S: ESP32 master drives BCLK/LRCK/MCLK from boot.
# TX → standard I2S → ES8311 (speaker/DAC)
# RX → TDM 4-slot   → ES7210 (microphone/ADC)
# ES7210 TDM slot order is MIC1, MIC3, MIC2, MIC4: slot 0 = board mic,
# slot 1 = MIC3 = hardware echo reference (speaker amp → on-board AEC divider).
# The I2C handle is only used to flip the ES7210 into TDM mode (ESPHome's own
# es7210 driver forces 2-slot I2S mode).
# Both channels enabled immediately so wake word works without prior playback.
waveshare_duplex_audio:
  id: ${id}_duplex_audio
  i2c_id: ${id}_i2c
  mclk_pin: 42
  bclk_pin: 9
  lrck_pin: 45
  dout_pin: 8
  din_pin: 10
  pa_pin: 46
  # 48 kHz on the shared BCLK/LRCK bus: the ES8311 plays at 48 kHz and the
  # ES7210 samples at 48 kHz. The mic task decimates 3:1 back to 16 kHz for the
  # AFE / micro_wake_word, so the voice stack still sees exactly what it did
  # before. Set back to 16000 to return to the original narrowband bus.
  sample_rate: 48000


# Audio Digital to Analogic Converter (Speaker) — ES8311 as I2S slave
audio_dac:
  - platform: es8311
    id: ${id}_audio_dac
    i2c_id: ${id}_i2c
    use_mclk: true
    sample_rate: 48000
    bits_per_sample: 16bit

# Audio Analogic to Digital Converter (Microphone) — ES7210 I2C init (gain/rate)
audio_adc:
  - platform: es7210
    id: ${id}_audio_adc
    i2c_id: ${id}_i2c
    sample_rate: 48000
    bits_per_sample: 16bit
    # Analog PGA gain applied before the ADC (0-37.5 dB). This is the right
    # place to add level: digital post-gain only amplifies quantisation noise.
    # Tune live with the "Mic Analog Gain" number; keep the two in sync.
    mic_gain: 30

# Microphone via duplex I2S TDM (reads ES7210 slot 0 = MIC1)
stream_microphone:
  id: ${id}_stream
  ip_address: ${stream_ip}
  port: ${stream_port}
  gain_factor: 1

microphone:
  - platform: waveshare_duplex_audio
    id: ${id}_microphone
    waveshare_duplex_audio_id: ${id}_duplex_audio
    # Voice-stack rate. Stays 16 kHz: this is what the AFE, micro_wake_word and
    # the STT stream consume, and the mic task decimates the 48 kHz bus down to it.
    sample_rate: 16000
    # Post-AFE software gain (start value; the HA number + restored global win).
    # The AFE runs WITHOUT AGC by default (like the vendor firmware), so this is
    # the knob that sets the level for the wake word and for STT.
    aec_gain: 8.0
    aec_nlp: aggressive
    on_data:
      - lambda: |-
          if (id(stream_audio).state) {
            id(${id}_stream).send(x);
          }

# Physical I2S Speaker Output (writes to always-on TX handle)
speaker:
  - platform: waveshare_duplex_audio
    id: ${id}_speaker
    waveshare_duplex_audio_id: ${id}_duplex_audio
    audio_dac: ${id}_audio_dac
    # Playback rate of the physical output. 48 kHz means the mixer and every
    # resampler below run at 48 kHz, so radio (44.1 kHz MP3) and HA media are no
    # longer squashed to 16 kHz.
    sample_rate: 48000
    buffer_duration: 1000ms

  - platform: mixer
    id: ${id}_mixer
    output_speaker: ${id}_speaker
    num_channels: 2
    task_stack_in_psram: true
    source_speakers:
      - id: ${id}_announcement_speaker
        timeout: never

      - id: ${id}_media_speaker
        timeout: never



  - platform: resampler
    id: ${id}_announcement_resampler_speaker
    output_speaker: ${id}_announcement_speaker
    
  - platform: resampler
    id: ${id}_media_resampler_speaker
    output_speaker: ${id}_media_speaker

# Media Player (uses mixer's separate speakers)
media_player:
  - platform: speaker
    id: ${id}_media_player
    name: Media Player
    # Raw (still compressed) stream bytes buffered between the HTTP reader and
    # the decoder. This is NOT decoded audio: 512 kB is ~32 s of a 128 kbps MP3,
    # far more than any network jitter needs. It used to be 2 MB, which ate all
    # but ~50 kB of the 2.36 MB free PSRAM and starved the physical speaker's
    # 192 kB output ring buffer -> OOM -> mixer hot-spin -> task watchdog reset
    # when a station was started (worst on the first play after boot, which is
    # exactly when the output ring is allocated).
    buffer_size: 512000
    # Decoder task stack in PSRAM instead of internal DRAM (the reader task
    # stays internal on purpose - see audio_pipeline.cpp start_tasks_()).
    task_stack_in_psram: true

    volume_min: 0.4
    volume_max: 0.85
    volume_increment: 0.05
    announcement_pipeline:
      speaker: ${id}_announcement_resampler_speaker
      format: FLAC
      sample_rate: 16000
      num_channels: 1

      
    media_pipeline:
      speaker: ${id}_media_resampler_speaker
      format: FLAC
      # Advertised to HA so media HA fetches/transcodes for this player is 48 kHz
      # like the DAC. URL radio is decoded on-device and is unaffected by this.
      sample_rate: 48000

    on_state:
      - logger.log: "MEDIA_PLAYER: state"
      # Status label only. This fires on every volume step as well, and a full
      # list repaint here starved the main loop and froze the UI.
      - script.execute: radio_status_update
    on_play:
      - logger.log: "MEDIA_PLAYER: on_play"
    on_pause:
      - logger.log: "MEDIA_PLAYER: on_pause"
    on_idle:
      - logger.log: "MEDIA_PLAYER: on_idle"
    on_announcement:
      - logger.log: "MEDIA_PLAYER: on_announcement"
    on_turn_off:
      - logger.log: "MEDIA_PLAYER: on_turn_off"
    on_turn_on:
      - logger.log: "MEDIA_PLAYER: on_turn_on"
    on_volume:
      - logger.log: 
          format: "MEDIA_PLAYER: on_volume changed to: %f"
          args: ['x']
      - lambda: |-
          int val = (int)(x * 100);
          lv_slider_set_value(id(volume_slider), val, LV_ANIM_OFF);
          lv_slider_set_value(id(sound_page_volume_slider), val, LV_ANIM_OFF);

#---------------- INTERNET RADIO ----------------#
# Station directory comes from radio-browser.info (same data HA's radio_browser
# integration uses). sh_radio owns the station data and the favourites list; the
# GET is done inside the C++ component so the response body can live in PSRAM.
#
# Playback ALWAYS goes through Home Assistant (see radio_play_via_ha): the
# component fires on_ha_play for every station, the YAML calls HA's
# media_player.play_media, and HA's ESPHome integration proxies the stream
# through its own ffmpeg as FLAC 48 kHz. That is why there is no codec probe, no
# "unsupported codec" path and no on-device codec filter any more.
switch:
  # Wake-word mute, the same flag the PWRON short-click toggles and the display
  # shows as a red bar. It is restored from flash, so without this switch a mute
  # could only be undone by pressing the device.
  - platform: template
    name: "Wake Word"
    id: ${id}_wake_word_switch
    icon: mdi:microphone
    optimistic: true
    restore_mode: DISABLED
    turn_on_action:
      - script.execute: start_wake_word
    turn_off_action:
      - script.execute: stop_wake_word
    lambda: 'return id(wake_word_enabled);'
  - platform: gpio
    pin: GPIO46
    name: "Power Amplifier"
    id: ${id}_pa_ctrl_switch
    restore_mode: ALWAYS_ON
    internal: true

  - platform: template
    name: Stream Audio
    id: stream_audio
    restore_mode: ALWAYS_OFF
    optimistic: true
    icon: mdi:record-rec
    turn_on_action:
      then:
        - microphone.capture: ${id}_microphone
    turn_off_action:
      then:
        - microphone.stop_capture: ${id}_microphone

  # Battery charging control (AXP2101 CHG_EN, reg 0x18 bit1).
  # Used by the "Waveshare AMOLED 2.16 Battery manager" HA automation to keep
  # the battery between 65% and 75%:
  #   ON  -> charging enabled  (battery charges from USB)
  #   OFF -> charging disabled (device keeps running from USB, battery rests)
  # Restores its last state across reboots so a reboot above 75% does not
  # re-enable charging.
  - platform: axp2101
    axp2101_id: axp2101_pmu
    charging_enabled:
      name: "Charging Enabled"
      id: ${id}_charging_enabled
      restore_mode: RESTORE_DEFAULT_ON
      entity_category: config

#---------------- DISPLAY ----------------#

# SPI Buses Configuration
spi:
  # SPI Bus 1 - SD Card
  - id: spi_sd
    clk_pin: GPIO2
    mosi_pin: GPIO1
    miso_pin: GPIO3
    interface: hardware
    

  # SPI Bus 2 - AMOLED Display (quad SPI)
  - id: spi_lcd
    type: quad
    clk_pin: GPIO38
    data_pins:
      - GPIO4
      - GPIO5
      - GPIO6
      - GPIO7
    interface: hardware

# AMOLED Display Configuration
display:
  - platform: mipi_spi
    id: ${id}_display
    spi_id: spi_lcd
    model: WAVESHARE-ESP32-S3-TOUCH-AMOLED-2.16

    auto_clear_enabled: false
    update_interval: never

# Capacitive Touch - CST9220 (built-in; board controller is CST92xx)
touchscreen:
  - platform: cst9220
    id: ${id}_touchscreen
    display: ${id}_display
    interrupt_pin: GPIO11
    reset_pin: GPIO40
    address: 0x5A
    calibration:
      x_min: 0
      x_max: 480
      y_min: 0
      y_max: 480
    on_touch:
      - script.execute: wake_display

# Define a font for text display
font:
  - file: 'gfonts://Playwrite+BR'
    id: gfont_playwrite_br
    size: 24

  - file: "https://cdn.jsdelivr.net/npm/@mdi/font@latest/fonts/materialdesignicons-webfont.ttf"
    id: mdi_32
    size: 32
    bpp: 4
    glyphs: [
      '󰖩', # mdi:wifi
      '󰖪', # mdi:wifi-off
      '󰕾', # mdi:volume-high
      '󰃟', # mdi:brightness-6
      '󰁹', # mdi:battery
