top_layer:
  widgets:
    - obj:
        id: topbar
        x: 0
        y: 0
        width: 480
        hidden: true
        height: 30
        bg_color: 0x6D6D6D
        border_width: 0
        border_color: 0x4B5563
        radius: 0
        pad_all: 0
        scrollbar_mode: "OFF"
        widgets:
          - label:
              id: topbar_time_label
              x: 40
              y: 5
              width: 65
              height: 18
              text: "00:00"
              text_color: 0xFFFFFF
              text_align: CENTER
              long_mode: DOT
              text_font: montserrat_16
          - label:
              id: topbar_active_app_icon
              x: 105
              y: 0
              width: 28
              height: 28
              text: "\uF013"
              text_font: montserrat_28
              text_align: CENTER
              text_color: 0xFFFFFF
          - label:
              id: topbar_battery_icon
              x: 413
              y: 0
              width: 28
              height: 28
              text: "\uF240"
              text_font: montserrat_28
              text_align: CENTER
              text_color: 0xFFFFFF
          - label:
              id: topbar_battery_value
              x: 350
              y: 5
              width: 60
              height: 20
              text: "100%"
              text_color: 0xFFFFFF
              text_align: CENTER
              text_font: montserrat_16
          - label:
              id: topbar_wifi_icon
              x: 319
              y: 0
              width: 28
              height: 28
              text: "\uF1EB"
              text_font: montserrat_28
              text_align: CENTER
              text_color: 0xFFFFFF

    - obj:
        id: volume_popup_backdrop
        hidden: true
        x: 0
        y: 0
        width: 480
        height: 480
        bg_color: 0x000000
        bg_opa: 60%
        border_width: 0
        radius: 0
        pad_all: 0
        scrollbar_mode: "OFF"
        clickable: true

    - obj:
        id: volume_popup_card
        hidden: true
        x: 30
        y: 150
        width: 420
        height: 105
        bg_color: 0x6D6D6D
        border_width: 1
        border_color: 0x4B5563
        radius: 8
        pad_all: 0
        scrollbar_mode: "OFF"
        widgets:
          - label:
              id: volume_down_icon
              x: 0
              y: 28
              width: 48
              height: 48
              text: "\uF027"
              text_font: montserrat_48
              text_align: CENTER
              text_color: 0xFFFFFF
          - slider:
              id: volume_slider
              x: 48
              y: 42
              width: 322
              height: 20
              value: 100
              min_value: 0
              max_value: 100
              bg_color: 0x374151
              radius: 9999
              knob:
                bg_color: 0xFFFFFF
                border_width: 2
                # theme accent
                styles: [accent_border]
              indicator:
                radius: 9999
                # theme accent
                styles: [accent_fill]

          - label:
              id: volume_up_icon
              x: 372
              y: 28
              width: 48
              height: 48
              text: "\uF028"
              text_font: montserrat_48
              text_align: CENTER
              text_color: 0xFFFFFF