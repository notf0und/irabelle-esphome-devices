# Copy the values into your own ESPHome secrets.yaml (do NOT use this file
# as-is). Generate the random values with:
#
#   openssl rand -base64 32
#
# api_key must be exactly 32 bytes, base64 encoded.

wifi_ssid: "your-ssid"
wifi_password: "your-wifi-password"

api_key: "REPLACE_WITH_32_BYTES_BASE64"
ota_password: "REPLACE_WITH_A_LONG_RANDOM_PASSWORD"

# password of the fallback AP the device opens when it cannot join WiFi
ap_password: "REPLACE_WITH_A_LONG_RANDOM_PASSWORD"
